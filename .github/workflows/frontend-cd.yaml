name: Frontend Continuous Deployment

on:
  push:
    branches: [master]
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - run: npm ci
      - run: CI=true npm test

  publish:
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
      BACKEND_API_URL: ${{ vars.BACKEND_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "$ECR_REPOSITORY" || {
            echo "ECR_FRONTEND_REPOSITORY is missing"
            exit 1
          }
          test -n "$BACKEND_API_URL" || {
            echo "BACKEND_API_URL is missing"
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$BACKEND_API_URL" \
            --tag "$ECR_REPOSITORY:${GITHUB_SHA}" \
            .

      - name: Push image to ECR
        run: docker push "$ECR_REPOSITORY:${GITHUB_SHA}"

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    env:
      ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy frontend
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image \
            frontend="$ECR_REPOSITORY:${GITHUB_SHA}"
          kustomize build | kubectl apply -f -

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/frontend \
            --timeout=180s
          kubectl get deployment frontend
          kubectl get service frontend

  report-failure:
    runs-on: ubuntu-latest
    needs: [lint, test, publish, deploy]
    if: failure()
    steps:
      - name: Report workflow failure
        run: |
          echo "Frontend CD failed. Review the failed job in GitHub Actions." \
            >> "$GITHUB_STEP_SUMMARY"
